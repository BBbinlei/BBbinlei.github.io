<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Step5 页式存储与行格式</title>
<link rel="stylesheet" href="../engine/engine.css">
</head>
<body>
<div id="start">
  <h1>✏️ Step5 · 页式存储与行格式</h1>
  <p id="intro"></p>
  <button class="btn" id="go">▶ 开始</button>
</div>
<div id="app">
  <div id="top">
    <div class="title" id="ttl"></div>
    <select id="chsel" aria-label="章节"></select>
    <button class="btn" id="back" title="回退 2 秒（←）">⟲ 2</button>
    <button class="btn" id="pp">⏸ 暂停</button>
    <button class="btn" id="fwd" title="快进 2 秒（→）">2 ⟳</button>
    <select id="spd" aria-label="语速"><option value="1">1×</option><option value="1.25">1.25×</option><option value="1.5" selected>1.5×</option><option value="2">2×</option></select>
    <button class="btn on" id="capbtn">字幕</button>
    <button class="btn sm on" id="sfxbtn" title="音效">🔊</button>
    <button class="btn sm on" id="bgmbtn" title="背景音乐">🎵</button>
  </div>
  <div id="bar"><i></i></div>
  <div id="section"></div>
  <div id="stage"><svg id="art" viewBox="0 0 800 640" preserveAspectRatio="xMidYMid meet"></svg></div>
  <div id="cap"></div>
</div>
<script src="script.js"></script>
<script>document.getElementById("ttl").textContent = LESSON.title; document.getElementById("intro").innerHTML = LESSON.intro || ""; document.title = LESSON.title;</script>
<script src="../engine/scene.js"></script>
<script src="../engine/player.js"></script>
</body>
</html>
